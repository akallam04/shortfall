comparison:
  haiku-v2: the unguided no-feedback arm with claude-haiku-5-5 on prompt version v2, trials 1 to 3 in benchmark/agent/unguided-haiku-1 and 4 to 10 in benchmark/agent/scale-10, which reproduced all three cases in 3 of 10 trials
  grid: the grid baseline, seeds 1 to 10 in benchmark/baselines/2004ed5
tests:
  primary:
    for each arm: trials out of 10 that reproduced all three cases, against haiku-v2, Fisher's exact test, two-sided
  secondary:
    for each arm: medusa-17032-last-unit, medusa-17032-counter and medusa-16502-lines against haiku-v2, and those three plus all three cases in one trial against the grid, Fisher's exact test, two-sided
  correction: Holm's correction over each arm's 8 tests, the primary test and the 7 secondary tests, applied per arm
  reading:
  - These tests are chosen and pushed before the first trial of this plan runs.
  - A test passes when its Holm-adjusted p-value is under 0.05.
  - The primary test answers the arm's question. If it passes, the arm reproduced all three cases at a different rate than haiku-v2. If it does not pass, the gap could be chance, whatever its direction.
  - The secondary tests are read only as a guide.
  - A held trial that stays held after its review is not counted, and the tests then use the trials that are counted.
report:
- 'Arms: budget-none is claude-haiku-5-5 on prompt version v2-budget with feedback none, where finish is not available while more than 60 runs are left. sonnet-none is claude-sonnet-5-5 on prompt version v2 with feedback none. Both are unguided, with 300 runs, 30 attempts, 100 turns and $1 per trial.'
- 'For each arm and each case: trials out of 10 that reproduced it, and the median runs to first reproduction over all 10 trials, counting a miss as over 300. If half or more missed, the median is reported as over 300.'
- 'For each arm: trials out of 10 that reproduced all three cases.'
- 'The tests above, with each p-value and its Holm-adjusted value.'
- 'Also reported, without tests: runs used per trial, attempts, claims backed and unbacked, cost and wall time per trial, and for budget-none how many times the finish gate answered.'
- 'Held trials are reviewed after the plan with the rule used for scale-10, including the review that tries the #16502 fix and Redis locking together for a scenario that no single fix clears. A trial that stays held is reported as held and is not counted.'

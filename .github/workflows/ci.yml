name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  oversold-pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - run: sh scripts/setup-oversold.sh
      - name: Verify every benchmark results folder
        run: |
          set -eu
          count=0
          for d in $(find benchmark/cases -mindepth 3 -maxdepth 3 -type d -path '*/results/*' | sort); do
            sh scripts/oversold.sh check --verify "$d"
            count=$((count + 1))
          done
          echo "verified $count folders"
          test "$count" -gt 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]'
      - name: Validate generated sweep files with the pinned Oversold
        run: |
          test -x .oversold/bin/oversold
          pytest tests/test_sweep.py -k oversold_validate -rs

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner .
      - name: Scan unpacked benchmark histories
        run: |
          set -eu
          tmp=$(mktemp -d)
          find benchmark -name '*.json.gz' -print | while read -r f; do
            mkdir -p "$tmp/$(dirname "$f")"
            gunzip -c "$f" > "$tmp/${f%.gz}"
          done
          echo "unpacked $(find "$tmp" -name '*.json' | wc -l) histories"
          ./gitleaks dir --redact --no-banner "$tmp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shortfall"
version = "0.0.1"
description = "An AI agent that looks for race bugs in open-source commerce engines and checks each guess with Oversold."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arun Teja Reddy Kallam" }]
requires-python = ">=3.12"
dependencies = [
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shortfall"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
